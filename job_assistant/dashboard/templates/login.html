<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; Justin Whitmore Career Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #101216; color: #E2E8F0; font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-[#181B22] border border-[#2A2E39] rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-[#C6F432] text-[#101216] font-bold flex items-center justify-center text-lg">
        JW
      </div>
      <div>
        <h1 class="text-lg font-bold text-white">Justin Whitmore Platform</h1>
        <p class="text-xs text-gray-400">Independent &amp; Private AI Recruiter Workspaces</p>
      </div>
    </div>

    <div id="login-alert" class="hidden p-3 rounded-lg bg-red-500/15 border border-red-500/40 text-xs text-red-300"></div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-300 mb-1">Account Username or Email</label>
        <input id="username" type="text" required autocomplete="username" placeholder="e.g. justin, isil, or lindsey"
          class="w-full px-3.5 py-2.5 rounded-lg bg-[#101216] border border-[#2A2E39] text-sm text-white focus:outline-none focus:border-[#C6F432]">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-300 mb-1">Password</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password"
          class="w-full px-3.5 py-2.5 rounded-lg bg-[#101216] border border-[#2A2E39] text-sm text-white focus:outline-none focus:border-[#C6F432]">
      </div>
      <button id="btn-submit" type="submit"
        class="w-full py-2.5 rounded-lg bg-[#C6F432] hover:bg-[#b5e322] text-[#101216] font-bold text-sm transition shadow">
        Sign In to My Recruiter
      </button>
    </form>

    <div class="flex items-center justify-between text-xs text-gray-400 pt-2 border-t border-[#2A2E39]">
      <button onclick="toggleRecovery()" class="hover:text-[#C6F432] transition">Password recovery</button>
      <span>Strict per-user vault isolation</span>
    </div>

    <!-- Password Recovery Drawer -->
    <div id="recovery-box" class="hidden pt-4 border-t border-[#2A2E39] space-y-3">
      <div class="text-xs font-semibold text-white">Account Password Recovery</div>
      <input id="rec-ident" type="text" placeholder="Username or email"
        class="w-full px-3 py-2 rounded-lg bg-[#101216] border border-[#2A2E39] text-xs text-white">
      <button onclick="requestReset()" class="w-full py-2 rounded-lg bg-[#2A2E39] hover:bg-gray-700 text-xs font-semibold text-white">
        Request Recovery Token
      </button>
      <div class="pt-2 space-y-2">
        <input id="rec-token" type="text" placeholder="Paste recovery token"
          class="w-full px-3 py-2 rounded-lg bg-[#101216] border border-[#2A2E39] text-xs text-white">
        <input id="rec-newpw" type="password" placeholder="New password (min 8 chars)"
          class="w-full px-3 py-2 rounded-lg bg-[#101216] border border-[#2A2E39] text-xs text-white">
        <button onclick="completeReset()" class="w-full py-2 rounded-lg bg-emerald-500 text-[#101216] text-xs font-bold">
          Reset Password
        </button>
      </div>
      <div id="rec-msg" class="text-xs text-gray-400"></div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('login-alert');
      alertBox.classList.add('hidden');
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'Authenticating...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          alertBox.innerText = data.error || 'Authentication failed';
          alertBox.classList.remove('hidden');
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        alertBox.innerText = 'Network error while signing in.';
        alertBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Sign In to My Recruiter';
      }
    }

    function toggleRecovery() {
      document.getElementById('recovery-box').classList.toggle('hidden');
    }

    async function requestReset() {
      const ident = document.getElementById('rec-ident').value.trim();
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifier: ident })
      });
      const d = await res.json();
      document.getElementById('rec-msg').innerText = d.message || 'Recovery requested.';
    }

    async function completeReset() {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: document.getElementById('rec-token').value.trim(),
          new_password: document.getElementById('rec-newpw').value
        })
      });
      const d = await res.json();
      document.getElementById('rec-msg').innerText = res.ok ? 'Password updated! You can now sign in above.' : (d.error || 'Failed');
    }
  </script>
</body>
</html>
